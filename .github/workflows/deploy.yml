name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx ng build --configuration production --base-href /technical-task/

      # SPA fallback: GitHub Pages serves 404.html for any unmatched deep link
      # (e.g. a refresh on /task-1-story-creation), so it needs to be the same
      # app shell as index.html for Angular's router to take over client-side.
      - run: cp dist/saif-portfolio/browser/index.html dist/saif-portfolio/browser/404.html

      # Pages runs everything through Jekyll by default, which ignores files/
      # folders starting with an underscore — not currently a problem for this
      # build's output names, but harmless and standard to disable anyway.
      - run: touch dist/saif-portfolio/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/saif-portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
